<!doctype html>
<html lang="en">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Github Issue Tracker</title>
    <!-- favicon -->
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon" />
    <!-- TailwindCSS & DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet" />
    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div id="details-container" class="space-y-5 w-full flex justify-center items-center h-screen">
      <div class="card bg-white border border-base-300  p-8 space-y-3 rounded-md">
        <h2 class="text-[#1f2937] font-bold text-xl">Fix broken image uploads</h2>
        <div class="flex items-center gap-2 p-0 ">
          <span class="badge bg-green-400 text-white rounded-full">opened</span>
          <span class="text-[5px] text-[#64748B]"><i class="fa-solid fa-circle"></i></span>
          <p class="text-[9px] text-[#64748B]">Opened by Fahim Ahmed</p>
          <span class="text-[5px] text-[#64748B]"><i class="fa-solid fa-circle"></i></span>
          <p class="text-[9px] text-[#64748B]">22/02/2026</p>
        </div>
        <div class="flex gap-2">
          <span>bug</span>
        </div>
        <p class="text-[#647488] text-[14px] text-justify">The navigation menu doesn't collapse properly on mobile devices. Need to fix the responsive behavior.</p>
        <div class="flex justify-between items-center rounded-md bg-base-200 p-3">
          <div class="text-left">
            <span>Assignee:</span><br>
            <p>Fahim Ahmed</p>
          </div>
          <div class="text-left">
            <span>Priority:</span><br>
            <p>High</p>
          </div>
        </div>
        <button class="btn btn-primary">close</button>
      </div>
     
    </div>
  </body>
</html>
