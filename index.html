<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Github issue tracker</title>
    <!-- favicon -->
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon" />
    <!-- TailwindCSS & DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet" />
    <!-- Main CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <section class="w-full flex justify-center items-center h-screen">
      <div class="card w-96 bg-base-100 shadow-xl p-6 space-y-6 ">
        <div class="space-y-2 text-center">
          <img
            src="./assets/github-logo.png"
            alt=""
            class="mx-auto mb-4 w-16" />
          <h1>GitHub Issue Tracker</h1>
          <p>Sign in to manage your issues</p>
        </div>
        <fieldset
          class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4 mx-auto">

          <label class="label text-[#1F2937] fold-semibold text-[16px]">Username</label>
          <input type="email" id="userName" class="input text-[#64748B]" placeholder="Enter Username" />
          <span class="mb-3 text-primary font-medium text-sm">Default: admin</span>

          <label class="label text-[#1F2937] fold-semibold text-[16px]">Password</label>
          <input type="password" id="password" class="input text-[#64748B]" placeholder="Enter Password" maxlength="8" minlength="8" />
          <span class="mb-3 text-primary font-medium text-sm">Default: admin123</span>
          <button  id="signInBtn" class="btn btn-primary mt-4">Sign In</button>
        </fieldset>
      </div>
    </section>
    <script src="./js/login.js"></script>
  </body>
</html>
